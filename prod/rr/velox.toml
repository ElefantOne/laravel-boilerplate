[roadrunner]
ref = "v3.0.1"

[github.token]
token = "${RT_TOKEN}"

[plugins.logger]
tag = "v6.0.0"
module_name = "github.com/roadrunner-server/logger/v6"

[plugins.http]
tag = "v6.1.0"
module_name = "github.com/roadrunner-server/http/v6"

[plugins.server]
tag = "v6.0.0"
module_name = "github.com/roadrunner-server/server/v6"

[debug]
enabled = false

[log]
level = "info"
mode = "production"
