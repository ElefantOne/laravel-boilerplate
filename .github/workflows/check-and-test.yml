name: "Check and Test code"

permissions:
  contents: read

on:
  push:

defaults:
  run:
    shell: bash
    working-directory: ./apps/frontend

jobs:
  check-and-test:
    name: check and test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          extensions: mbstring, xml, zip, curl, gd, bcmath, exif, fileinfo, intl, json, mysqli, pdo_mysql, soap, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install ZeroMQ extension
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzmq3-dev
          zmq_source=$(mktemp -d)
          curl -fsSL https://codeload.github.com/remicollet/php-zmq/tar.gz/4f7780d88e04824cb561006b50a7e6550f6e83eb \
            | tar -xz --strip-components=1 -C "$zmq_source"
          cd "$zmq_source"
          phpize
          ./configure
          make -j"$(nproc)"
          sudo install -m 0644 modules/zmq.so "$(php-config --extension-dir)/zmq.so"
          echo 'extension=zmq.so' | sudo tee /etc/php/8.6/mods-available/zmq.ini >/dev/null
          sudo phpenmod -v 8.6 -s cli zmq
          php --ri zmq

      - name: Install TurboCov
        # PHP 8.6 support landed after the 0.1.1 release.
        run: |
          turbocov_source=$(mktemp -d)
          curl -fsSL https://codeload.github.com/shipmonk-rnd/turbocov/tar.gz/0dbe4a90fa42d12c1a1460ab2c509d3aca36fa87 \
            | tar -xz --strip-components=1 -C "$turbocov_source"
          cd "$turbocov_source"
          phpize
          ./configure --enable-turbocov
          make -j"$(nproc)"
          sudo install -m 0644 modules/turbocov.so "$(php-config --extension-dir)/turbocov.so"
          echo 'extension=turbocov.so' | sudo tee /etc/php/8.6/mods-available/turbocov.ini >/dev/null
          sudo phpenmod -v 8.6 -s cli turbocov
          php --ri turbocov

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer global require enlightn/security-checker

      - name: Set up key and migrate database
        run: |
          cp -n ../../dev-frontend.env .env
          php artisan key:generate
          php artisan migrate --force

      - name: Check code
        run: sh check-code.sh

      - name: Run tests with line coverage
        run: composer test-coverage

      - name: Check security
        run: |
          security-checker security:check composer.lock
          composer audit
