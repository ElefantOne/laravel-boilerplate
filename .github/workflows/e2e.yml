name: End-to-End

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run full-stack end-to-end checks
        run: bash scripts/e2e.sh
