# include:
# - compose.rpc.yml

services:
  apps:
    image: laravel_app_dev:1.0
    container_name: apps_dev
    env_file:
      - dev.env
    volumes:
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./apps:/app
    command: sh run.sh
    networks:
      - app_dev
    depends_on:
      - kividb
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: docker.io/library/caddy:latest
    container_name: caddy_dev
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./apps:/app
    networks:
      - app_dev
    depends_on:
      - apps
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    deploy:
      resources:
        limits:
          memory: 128M

  buggregator:
    image: ghcr.io/buggregator/server:latest
    container_name: buggregator_dev
    networks:
      - app_dev
    ports:
      - "8000:8000"
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    deploy:
      resources:
        limits:
          memory: 512M

  kividb:
    image: ghcr.io/kividbio/kividb:v1.1.0-lua
    container_name: kividb_dev
    env_file:
      - dev-frontend.env
    command: ["--port", "6379", "--aof", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - kividb_data:/home/kividb
    networks:
      - app_dev
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    ulimits:
      memlock: -1

  rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: rustfs_dev
    command: ["/data"]
    env_file:
      - dev.env
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app_dev
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

volumes:
  kividb_data:
    name: kividb_dev_data
  rustfs_data:
    name: rustfs_dev_data

networks:
  app_dev:
    driver: bridge
    name: app_dev
